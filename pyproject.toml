[project]
name = "reinforcement-learning-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

# core deps
dependencies = [
    "black>=26.10.1",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "tensorboard>=2.21.0",
    "tqdm>=4.70.1",
]

# add a group for each output
[dependency-groups]
pong = [
    "gymnasium>=1.4.0",
    "stable-baselines3[extra]>=2.9.2"
]

cnn = [
    "opencv-python>=5.0.0.93",
    "torch>=2.15",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.2",
]


[[tool.mypy.overrides]]
module = [
    "torchvision.*",
    "tensorboard.*",
    "tqdm.*"
]
ignore_missing_imports = true
